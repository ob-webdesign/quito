    <style>
        :root {
            --black:      #0b0906;
            --terracotta: #C4793A;
            --warm-white: #F4EFE6;
            --muted:      rgba(244, 239, 230, 0.45);
            --font-d: 'Cormorant Garamond', serif;
            --font-b: 'Source Sans 3', sans-serif;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
            --pad: clamp(1.5rem, 4vw, 3rem);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: var(--font-b);
            background: var(--black);
            color: var(--warm-white);
            -webkit-font-smoothing: antialiased;
        }
        a { text-decoration: none; color: inherit; }

        /* ── SLIDES ── */
        .gallery {
            position: fixed;
            inset: 0;
            z-index: 1;
            cursor: zoom-in;
        }
        .slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            overflow: hidden;
            transition: opacity 1s ease;
            will-change: opacity;
        }
        .slide.active { opacity: 1; }
        .slide-bg {
            position: absolute;
            inset: -8%;
            background-size: cover;
            background-position: center;
            filter: blur(60px) saturate(1.15) brightness(.75);
            transform: scale(1.15);
            opacity: 0;
            z-index: 0;
        }
        .slide.letterboxed .slide-bg { opacity: 1; }
        .slide img {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.04);
            transition: transform 7s var(--ease);
        }
        .slide.active img { transform: scale(1); }
        .slide.letterboxed img {
            object-fit: contain;
        }

        /* ── LIGHT GRADIENTS (legibility only — no schlieren) ── */
        .grad-top {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 180px;
            background: linear-gradient(to bottom, rgba(11,9,6,.72) 0%, transparent 100%);
            z-index: 10;
            pointer-events: none;
        }
        .grad-bottom {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 260px;
            background: linear-gradient(to top, rgba(11,9,6,.82) 0%, rgba(11,9,6,.28) 60%, transparent 100%);
            z-index: 10;
            pointer-events: none;
        }

        /* ── HOVER ZONES (prev / next) ── */
        .zone {
            position: fixed;
            top: 0; bottom: 0;
            z-index: 20;
            width: 22%;
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .zone-prev { left: 0; justify-content: flex-start; padding-left: clamp(1rem, 2.5vw, 2rem); }
        .zone-next { right: 0; justify-content: flex-end;  padding-right: clamp(1rem, 2.5vw, 2rem); }
        .zone-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border: 1px solid rgba(244, 239, 230, 0.22);
            border-radius: 50%;
            opacity: 0;
            transform: scale(.88);
            transition: opacity .35s ease, transform .35s var(--ease), border-color .3s;
        }
        .zone-icon svg { width: 14px; height: 14px; stroke: var(--warm-white); fill: none; stroke-width: 1.5; }
        .zone:hover .zone-icon {
            opacity: 1;
            transform: scale(1);
        }
        .zone:hover .zone-icon { border-color: rgba(244, 239, 230, 0.45); }

        /* ── TOP BAR ── */
        .bar-top {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 30;
            padding: clamp(1.2rem, 2.8vw, 2rem) var(--pad);
            padding-top: calc(clamp(1.2rem, 2.8vw, 2rem) + env(safe-area-inset-top));
            display: flex;
            align-items: center;
            justify-content: space-between;
            opacity: 0;
            animation: fadeIn .9s var(--ease) .2s forwards;
        }

        .bar-right { display: flex; align-items: center; gap: .9rem; }

        .back-link {
            font-family: var(--font-b);
            font-size: .68rem;
            font-weight: 400;
            letter-spacing: .16em;
            text-transform: uppercase;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: .65rem;
            transition: color .3s;
        }
        .back-link .line {
            display: block;
            width: 22px;
            height: 1px;
            background: currentColor;
            transition: width .35s var(--ease);
        }
        .back-link:hover { color: var(--warm-white); }
        .back-link:hover .line { width: 34px; }

        .bar-label {
            font-family: var(--font-b);
            font-size: .6rem;
            font-weight: 500;
            letter-spacing: .24em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .counter {
            display: flex;
            align-items: baseline;
            gap: .25rem;
        }
        .counter-cur {
            font-family: var(--font-d);
            font-size: 1.05rem;
            font-weight: 300;
            color: var(--warm-white);
            letter-spacing: .03em;
            min-width: 1.6ch;
            transition: opacity .25s ease;
        }
        .counter-sep {
            font-family: var(--font-b);
            font-size: .55rem;
            color: var(--muted);
            letter-spacing: .08em;
            margin: 0 .05rem;
        }
        .counter-tot {
            font-family: var(--font-d);
            font-size: .78rem;
            font-weight: 300;
            color: var(--muted);
            letter-spacing: .03em;
        }

        /* ── BOTTOM CAPTION ── */
        .caption {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 30;
            padding: var(--pad);
            padding-bottom: calc(var(--pad) + env(safe-area-inset-bottom));
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
        }

        .caption-text { flex: 1; }
        .caption-cat {
            font-family: var(--font-b);
            font-size: .6rem;
            font-weight: 500;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: var(--terracotta);
            margin-bottom: .45rem;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity .45s ease .1s, transform .45s var(--ease) .1s;
        }
        .caption-title {
            font-family: var(--font-d);
            font-size: clamp(1.9rem, 4.5vw, 3.4rem);
            font-weight: 300;
            font-style: italic;
            color: var(--warm-white);
            letter-spacing: .01em;
            line-height: 1.1;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity .55s ease .2s, transform .55s var(--ease) .2s;
        }
        .caption.visible .caption-cat,
        .caption.visible .caption-title {
            opacity: 1;
            transform: translateY(0);
        }
        .caption.out .caption-cat,
        .caption.out .caption-title {
            opacity: 0;
            transform: translateY(-6px);
            transition: opacity .28s ease, transform .28s var(--ease);
        }

        /* Bottom nav */
        .cap-nav {
            display: flex;
            align-items: center;
            gap: .5rem;
            padding-bottom: .2rem;
        }
        .nav-btn {
            background: none;
            border: 1px solid rgba(244, 239, 230, 0.18);
            color: var(--muted);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: border-color .3s, color .3s, background .3s;
        }
        .nav-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.5; }
        .nav-btn:hover {
            border-color: rgba(244, 239, 230, 0.5);
            color: var(--warm-white);
            background: rgba(244, 239, 230, .04);
        }
        .nav-btn:focus-visible { outline: 2px solid var(--terracotta); outline-offset: 3px; }

        /* ── PROGRESS LINE ── */
        .progress {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 1px;
            background: rgba(244, 239, 230, .08);
            z-index: 40;
            pointer-events: none;
        }
        .progress-fill {
            height: 100%;
            background: var(--terracotta);
            transition: width .65s var(--ease);
            width: 0%;
        }

        /* ── LIGHTBOX ── */
        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(11, 9, 6, .96);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(2rem, 5vw, 4rem);
            opacity: 0;
            pointer-events: none;
            transition: opacity .5s ease;
        }
        .lightbox.open {
            opacity: 1;
            pointer-events: auto;
        }
        .lb-bg {
            position: absolute;
            inset: -8%;
            background-size: cover;
            background-position: center;
            filter: blur(70px) saturate(1.15) brightness(.6);
            transform: scale(1.15);
            opacity: 0;
            transition: opacity .6s ease;
            z-index: 0;
        }
        .lightbox.open .lb-bg { opacity: .85; }
        .lb-inner {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            max-width: min(88vw, 1100px);
        }
        .lb-inner img {
            max-height: 78vh;
            max-width: 100%;
            object-fit: contain;
            display: block;
        }
        .lb-meta {
            display: flex;
            align-items: baseline;
            gap: 1.2rem;
            margin-top: 1.1rem;
        }
        .lb-title {
            font-family: var(--font-d);
            font-size: clamp(1rem, 2vw, 1.4rem);
            font-weight: 300;
            font-style: italic;
            color: var(--warm-white);
        }
        .lb-cat {
            font-family: var(--font-b);
            font-size: .58rem;
            font-weight: 500;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: var(--terracotta);
        }
        .lb-close {
            position: absolute;
            top: -2.4rem;
            right: 0;
            background: none;
            border: none;
            color: var(--muted);
            font-family: var(--font-b);
            font-size: .6rem;
            font-weight: 500;
            letter-spacing: .16em;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: .5rem;
            padding: 0;
            transition: color .3s;
        }
        .lb-close::after {
            content: '';
            display: block;
            width: 14px;
            height: 1px;
            background: currentColor;
        }
        .lb-close:hover { color: var(--warm-white); }
        .lb-close:focus-visible { outline: 2px solid var(--terracotta); outline-offset: 3px; }

        /* ── INITIAL FADE ── */
        @keyframes fadeIn { to { opacity: 1; } }

        /* ── MOBILE ── */
        @keyframes hint-arrow {
            0%   { opacity: 0; transform: scale(.88); }
            25%  { opacity: 1; transform: scale(1); }
            75%  { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(.88); }
        }
        @media (max-width: 768px) {
            .bar-label { display: none; }
            .zone { width: 28%; }
            .zone-next .zone-icon {
                animation: hint-arrow 2s var(--ease) 0.8s 1;
            }
        }
        @media (max-width: 480px) {
            .caption-title { font-size: 1.75rem; }
            .cap-nav { display: none; }
        }

        /* ── REDUCED MOTION ── */
        @media (prefers-reduced-motion: reduce) {
            .slide { transition: opacity .3s ease; }
            .slide img { transition: none; transform: scale(1); }
            .caption-cat, .caption-title { transition: opacity .2s ease; }
            .bar-top { animation: none; opacity: 1; }
        }

        /* ── ALBUM GRID VIEW ── */
        html.mode-grid, html.mode-grid body { height: auto; overflow-y: auto; overflow-x: hidden; }

        .album-view { position: relative; z-index: 1; min-height: 100vh; padding: calc(var(--pad) + 3rem) var(--pad) var(--pad); padding-top: calc(var(--pad) + 3rem + env(safe-area-inset-top)); max-width: 1400px; margin: 0 auto; }
        .album-view[hidden] { display: none; }

        .album-view-head { margin-bottom: clamp(2rem, 5vw, 3.5rem); opacity: 0; animation: fadeIn .9s var(--ease) .1s forwards; }
        .album-view-head .back-link { margin-bottom: 1.6rem; }
        .album-view-title { font-family: var(--font-d); font-style: italic; font-weight: 300; font-size: clamp(2.1rem, 6vw, 3.6rem); color: var(--warm-white); letter-spacing: .01em; }
        .album-view-sub { font-family: var(--font-b); font-size: .92rem; color: var(--muted); margin-top: .65rem; }

        .album-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: clamp(1.5rem, 3vw, 2.5rem); }

        .album-grid-wrap { position: relative; }
        .album-grid-nav {
            display: none;
            position: absolute;
            top: 42%;
            transform: translateY(-50%);
            z-index: 5;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: rgba(11, 9, 6, .55);
            border: 1px solid rgba(244, 239, 230, .25);
            backdrop-filter: blur(3px);
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--warm-white);
            transition: background .3s, border-color .3s, opacity .3s;
        }
        .album-grid-nav svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.5; }
        .album-grid-nav:hover { background: rgba(11, 9, 6, .8); border-color: rgba(244, 239, 230, .5); }
        .album-grid-nav.prev { left: -1.3rem; }
        .album-grid-nav.next { right: -1.3rem; }
        .album-grid-nav.edge-hidden { opacity: 0; pointer-events: none; }
        .album-grid-nav:focus-visible { outline: 2px solid var(--terracotta); outline-offset: 3px; }
        @media (min-width: 769px) {
            .album-grid-nav { display: flex; }
        }
        @media (min-width: 769px) and (max-width: 1100px) {
            .album-grid-nav.prev { left: .3rem; }
            .album-grid-nav.next { right: .3rem; }
        }

        .album-tile { display: block; cursor: pointer; opacity: 0; transform: translateY(14px); animation: albumTileIn .7s var(--ease) forwards; }
        @keyframes albumTileIn { to { opacity: 1; transform: none; } }
        .album-tile-media { position: relative; aspect-ratio: 4/5; border-radius: 6px; overflow: hidden; background: #151109; }
        .album-tile-media img { width: 100%; height: 100%; object-fit: cover; display: block; transform: scale(1.02); transition: transform .7s var(--ease); }
        .album-tile:hover .album-tile-media img { transform: scale(1.08); }
        .album-tile-media::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(11,9,6,.55) 0%, transparent 45%); pointer-events: none; }

        .album-tile-count { position: absolute; bottom: .9rem; right: .9rem; font-family: var(--font-b); font-size: .58rem; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--warm-white); background: rgba(11,9,6,.55); border: 1px solid rgba(244,239,230,.25); padding: .4em .9em; border-radius: 999px; backdrop-filter: blur(3px); }

        .album-tile-text { padding-top: 1.1rem; }
        .album-tile-cat { display: block; font-family: var(--font-b); font-size: .6rem; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--terracotta); margin-bottom: .4rem; }
        .album-tile-title { font-family: var(--font-d); font-style: italic; font-weight: 300; font-size: clamp(1.35rem, 2.4vw, 1.9rem); color: var(--warm-white); letter-spacing: .01em; }

        @media (max-width: 768px) {
            .album-grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
            .album-tile-title { font-size: 1.05rem; }
        }
        @media (max-width: 480px) {
            .album-grid { grid-template-columns: 1fr; }
        }
        @media (prefers-reduced-motion: reduce) {
            .album-tile { opacity: 1; transform: none; animation: none; }
            .album-view-head { opacity: 1; animation: none; }
        }

        /* === FOOTER === */
        footer { background: var(--black); color: #fff; padding: clamp(3rem,6vw,5rem) 0 calc(clamp(2rem,4vw,3rem) + env(safe-area-inset-bottom)); }
        .foot-inner { max-width: var(--max); margin: 0 auto; padding: 0 var(--pad); display: flex; flex-direction: column; align-items: center; gap: 0; text-align: center; }
        .foot-logo { margin-bottom: 2rem; }
        .foot-logo img  { height: 30px; filter: invert(1); margin: 0 auto; }
        .foot-logo-text { font-family: var(--font-b); font-weight: 700; font-size: 1.6rem; letter-spacing: .12em; text-transform: uppercase; color: #fff; display: none; }
        .foot-info { display: flex; flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0; margin-bottom: 1.75rem; }
        .foot-info p { font-size: .95rem; color: rgba(255,255,255,.55); line-height: 1.7; }
        .foot-info p + p::before { content: '·'; margin: 0 1.25rem; color: rgba(255,255,255,.25); }
        .foot-info a { color: rgba(255,255,255,.55); transition: color .2s; }
        .foot-info a:hover { color: #fff; }
        .foot-social { display: flex; align-items: center; justify-content: center; gap: .6rem; margin-bottom: 2.5rem; color: rgba(255,255,255,.55); font-size: .92rem; transition: color .2s; }
        .foot-social:hover { color: #fff; }
        .foot-social svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
        .foot-divider { width: 48px; height: 1px; background: rgba(255,255,255,.15); margin: 0 auto 2rem; }
        .foot-bottom { display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 2rem; flex-wrap: wrap; }
        .foot-copy { font-size: .78rem; color: rgba(255,255,255,.3); }
        .foot-links { display: flex; gap: 2rem; list-style: none; }
        .foot-links a { font-size: .78rem; color: rgba(255,255,255,.4); transition: color .2s; }
        .foot-links a:hover { color: #fff; }
        .foot-credit { font-size: .78rem; color: rgba(255,255,255,.2); }
        .foot-credit-sep { color: rgba(255,255,255,.15); margin: 0 .4em; }
        .foot-credit-block { display: none; }
        @media (max-width: 480px) {
            .foot-info { flex-direction: column; gap: .35rem; }
            .foot-info p + p::before { content: none; }
            .foot-bottom { flex-direction: column; gap: .6rem; }
            .foot-credit-inline, .foot-credit-sep { display: none; }
            .foot-credit-block { display: block; text-align: center; margin-top: calc(-0.6rem + .15rem); }
        }

        /* === ADMIN === */
        .gallery-admin-trigger { display: flex; justify-content: center; padding: 3rem 0 .5rem; cursor: default; }
        .gallery-admin-trigger img { height: 22px; filter: invert(1) brightness(1.6); opacity: .35; }

        .admin-modal { position: fixed; inset: 0; background: rgba(11,9,6,.88); z-index: 9500; display: flex; align-items: center; justify-content: center; padding: 1.5rem; opacity: 0; pointer-events: none; transition: opacity .2s; }

<script>
(function () {
    var isMobile    = window.innerWidth <= 768;
    var AUTO_MS     = 4000;
    var current     = 0;
    var total       = 0;
    var autoTimer   = null;
    var SLIDES      = [];

    var htmlEl        = document.documentElement;
    var slideshowView = document.getElementById('slideshowView');
    var albumView      = document.getElementById('albumView');
    var albumViewBack  = document.getElementById('albumViewBack');
    var albumViewTitle = document.getElementById('albumViewTitle');
    var albumViewSub   = document.getElementById('albumViewSub');
    var albumGrid       = document.getElementById('albumGrid');
    var albumGridPrev   = document.getElementById('albumGridPrev');
    var albumGridNext   = document.getElementById('albumGridNext');
    var slideshowBack   = document.getElementById('slideshowBack');

    var gallery      = document.getElementById('gallery');
    var caption      = document.getElementById('caption');
    var captionCat   = document.getElementById('captionCat');
    var captionTitle = document.getElementById('captionTitle');
    var counterCur   = document.getElementById('counterCur');
    var counterTot   = document.getElementById('counterTot');
    var progressFill = document.getElementById('progressFill');
    var lightbox     = document.getElementById('lightbox');
    var lbImg        = document.getElementById('lbImg');
    var lbBg         = document.getElementById('lbBg');
    var lbTitle      = document.getElementById('lbTitle');
    var lbCat        = document.getElementById('lbCat');

    function fmt(n) { return n < 10 ? '0' + n : '' + n; }

    // slugify() muss exakt zum serverseitigen Pendant in api/_admin-utils.js passen.
    function slugify(name) {
        return String(name)
            .normalize('NFKD')
            .replace(/[̀-ͯ]/g, '')
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/^-+|-+$/g, '');
    }

    // Bilddaten werden von /api/gallery-data geladen (serverseitig in Vercel Blob
    // gespeichert, online per Admin-UI bearbeitbar). Die eingebetteten
    // GALERIE_DATA/ALBEN_DATA-Blöcke dienen nur als Offline-Fallback.
    var ALL_PHOTOS = [];
    var ALBEN      = {};
    var DATA_VERSION = null;

    function resolveSrc(photo) {
        return photo.source === 'blob' ? photo.src : '../bilder/' + photo.src;
    }

    async function loadGalleryData() {
        try {
            var res = await fetch('/api/gallery-data', { cache: 'no-store' });
            if (!res.ok) throw new Error();
            var data = await res.json();
            ALL_PHOTOS = data.photos || [];
            ALBEN      = data.albums || {};
            DATA_VERSION = data.version;
        } catch (err) {
            // Galerie funktioniert auch ohne API/Blob-Store weiter (statischer Stand)
            ALL_PHOTOS = (window.GALERIE_DATA || []).map(function (p) {
                return Object.assign({ id: slugify((p.album || 'sonstige') + '-' + p.src), source: 'local' }, p);
            });
            var rawAlben = window.ALBEN_DATA || {};
            ALBEN = {};
            Object.keys(rawAlben).forEach(function (slug) {
                var meta = rawAlben[slug];
                var cover = null;
                if (meta.cover) {
                    var found = ALL_PHOTOS.find(function (p) { return p.album === slug && p.src === meta.cover; });
                    cover = found ? found.id : null;
                }
                ALBEN[slug] = { title: meta.title, order: meta.order, cover: cover, subalbums: meta.subalbums || null };
            });
            DATA_VERSION = null;
        }
    }

    function photosFor(album, sub) {
        return ALL_PHOTOS.filter(function (p) {
            var a = p.album || 'sonstige';
            if (a !== album) return false;
            if (sub) return p.subalbum === sub;
            return true;
        });
    }

    function albumPhotoCount(album) {
        return ALL_PHOTOS.filter(function (p) { return (p.album || 'sonstige') === album; }).length;
    }

    function albumHasSubalbums(slug) {
        var meta = ALBEN[slug];
        return !!(meta && meta.subalbums && Object.keys(meta.subalbums).length);
    }

    function coverSrc(photos, coverId) {
        var explicit = coverId ? ALL_PHOTOS.find(function (p) { return p.id === coverId; }) : null;
        if (explicit) return resolveSrc(explicit);
        if (photos.length) return resolveSrc(photos[0]);
        return '../bilder/hero.WEBP';
    }

    // ── ALBUM-KACHEL BAUEN ──
    function buildTile(opts) {
        var a = document.createElement('a');
        a.className = 'album-tile';
        a.href = opts.href;
        a.style.animationDelay = (opts.delay * 0.06) + 's';
        a.addEventListener('click', function (e) {
            e.preventDefault();
            opts.onClick();
        });

        var media = document.createElement('div');
        media.className = 'album-tile-media';
        var img = document.createElement('img');
        img.src      = opts.cover;
        img.alt      = opts.title;
        img.loading  = 'lazy';
        img.decoding = 'async';
        media.appendChild(img);

        if (opts.onEdit) {
            var editBtn = document.createElement('button');
            editBtn.type = 'button';
            editBtn.className = 'album-tile-edit';
            editBtn.setAttribute('aria-label', 'Album bearbeiten');
            editBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
            editBtn.addEventListener('click', function (e) {
                e.preventDefault();
                e.stopPropagation();
                opts.onEdit();
            });
            media.appendChild(editBtn);
        }

        var countBadge = document.createElement('span');
        countBadge.className = 'album-tile-count';
        countBadge.textContent = opts.count + (opts.count === 1 ? ' Foto' : ' Fotos');
        media.appendChild(countBadge);

        var text = document.createElement('div');
        text.className = 'album-tile-text';
        var cat = document.createElement('span');
        cat.className = 'album-tile-cat';
        cat.textContent = opts.cat;
        var title = document.createElement('h2');
        title.className = 'album-tile-title';
        title.textContent = opts.title;
        text.appendChild(cat);
        text.appendChild(title);

        a.appendChild(media);
        a.appendChild(text);
        return a;
    }

    // ── ALBUM-GRID: horizontales Scrollen per Pfeil (Desktop) ──
    function scrollAlbumGrid(dir) {
        var tile = albumGrid.querySelector('.album-tile, .album-tile-new');
        var gap  = parseFloat(getComputedStyle(albumGrid).columnGap) || 24;
        var step = tile ? tile.getBoundingClientRect().width + gap : albumGrid.clientWidth * 0.8;
        albumGrid.scrollBy({ left: dir * step, behavior: 'smooth' });
    }
    function updateAlbumGridNav() {
        if (!albumGridPrev) return;
        var maxScroll = albumGrid.scrollWidth - albumGrid.clientWidth - 2;
        albumGridPrev.classList.toggle('edge-hidden', albumGrid.scrollLeft <= 2);
        albumGridNext.classList.toggle('edge-hidden', maxScroll <= 0 || albumGrid.scrollLeft >= maxScroll);
    }
    if (albumGridPrev && albumGridNext) {
        albumGridPrev.addEventListener('click', function () { scrollAlbumGrid(-1); });
        albumGridNext.addEventListener('click', function () { scrollAlbumGrid(1); });
        albumGrid.addEventListener('scroll', updateAlbumGridNav);
        window.addEventListener('resize', updateAlbumGridNav);
    }

    // ── TOP-LEVEL ALBUM-GRID ──
    function renderAlbumGrid() {
        albumViewBack.href = 'index.html';
        albumViewBack.onclick = null;
        albumViewTitle.textContent = 'Galerie';
        albumViewSub.textContent = 'Ein Blick in unser Café — in Bildern.';

        var slugs = Object.keys(ALBEN).filter(function (slug) {
            return albumPhotoCount(slug) > 0 || albumHasSubalbums(slug);
        });
        slugs.sort(function (a, b) { return (ALBEN[a].order || 99) - (ALBEN[b].order || 99); });

        albumGrid.innerHTML = '';
        slugs.forEach(function (slug, i) {
            var meta   = ALBEN[slug];
            var photos = photosFor(slug);
            albumGrid.appendChild(buildTile({
                href: 'galerie.html?album=' + encodeURIComponent(slug),
                cover: coverSrc(photos, meta.cover),
                title: meta.title,
                cat: 'Galerie',
                count: albumPhotoCount(slug),
                delay: i,
                onClick: function () { navigateTo(slug, null); },
                onEdit: function () { openAlbumEditModal(slug); }
            }));
        });
        albumGrid.appendChild(buildNewAlbumTile());
        albumGrid.scrollLeft = 0;
        updateAlbumGridNav();
    }

    // ── NEUES-ALBUM-KACHEL (nur admin, per CSS ein-/ausgeblendet) ──
    function buildNewAlbumTile() {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'album-tile-new';
        btn.innerHTML = '<span class="album-tile-new-plus">+</span><span>Neues Album</span>';
        btn.addEventListener('click', function () { openAlbumEditModal(null); });
        return btn;
    }

    // ── UNTERALBEN-GRID ──
    function renderSubalbumGrid(albumSlug) {
        var meta = ALBEN[albumSlug];
        albumViewBack.href = 'galerie.html';
        albumViewBack.onclick = function (e) { e.preventDefault(); navigateTo(null, null); };
        albumViewTitle.textContent = meta.title;
        albumViewSub.textContent = '';

        var subSlugs = Object.keys(meta.subalbums || {});
        subSlugs.sort(function (a, b) { return (meta.subalbums[a].order || 99) - (meta.subalbums[b].order || 99); });

        albumGrid.innerHTML = '';
        subSlugs.forEach(function (subSlug, i) {
            var subMeta = meta.subalbums[subSlug];
            var photos  = photosFor(albumSlug, subSlug);
            albumGrid.appendChild(buildTile({
                href: 'galerie.html?album=' + encodeURIComponent(albumSlug) + '&sub=' + encodeURIComponent(subSlug),
                cover: coverSrc(photos, subMeta.cover),
                title: subMeta.title,
                cat: meta.title,
                count: photos.length,
                delay: i,
                onClick: function () { navigateTo(albumSlug, subSlug); }
            }));
        });
        albumGrid.scrollLeft = 0;
        updateAlbumGridNav();
    }

    // ── SLIDESHOW (wiedereintrittsfähig) ──
    function renderSlideshow(photos, state) {
        var filtered = photos.filter(function (s) {
            var o = s.orient || 'both';
            return o === 'both' || (isMobile ? o === 'portrait' : o === 'landscape');
        });
        if (filtered.length === 0) filtered = photos;

        SLIDES = filtered.map(function (s) {
            return { src: resolveSrc(s), title: s.title, cat: s.cat, photo: s };
        });

        clearInterval(autoTimer);
        gallery.innerHTML = '';
        current = 0;
        total = SLIDES.length;
        counterTot.textContent = fmt(total);

        SLIDES.forEach(function (s, i) {
            var div = document.createElement('div');
            div.className = 'slide' + (i === 0 ? ' active' : '');

            var bg = document.createElement('div');
            bg.className = 'slide-bg';
            bg.style.backgroundImage = 'url(' + s.src + ')';
            div.appendChild(bg);

            var img = document.createElement('img');
            var checkOrientation = function () {
                var imgIsPortrait      = img.naturalHeight > img.naturalWidth;
                var viewportIsPortrait = window.innerHeight > window.innerWidth;
                if (imgIsPortrait !== viewportIsPortrait) div.classList.add('letterboxed');
            };
            img.addEventListener('load', checkOrientation);
            img.src      = s.src;
            img.alt      = s.title + ' — Café QUITO';
            img.loading  = i < 2 ? 'eager' : 'lazy';
            img.decoding = 'async';
            if (img.complete && img.naturalWidth) checkOrientation();
            div.appendChild(img);
            gallery.appendChild(div);
        });

        progressFill.style.width = total ? (1 / total * 100) + '%' : '0%';
        if (total > 0) {
            updateCaption(false);
            autoTimer = setInterval(next, AUTO_MS);
        } else {
            captionCat.textContent = '';
            captionTitle.textContent = '';
        }

        var hasSubs = albumHasSubalbums(state.album);
        slideshowBack.onclick = function (e) {
            e.preventDefault();
            if (hasSubs) navigateTo(state.album, null);
            else navigateTo(null, null);
        };
    }

    // ── MODUS-STEUERUNG (Grid vs. Slideshow) ──
    function setMode(mode) {
        htmlEl.classList.toggle('mode-grid', mode !== 'slideshow');
        slideshowView.hidden = mode === 'slideshow' ? false : true;
        albumView.hidden     = mode === 'slideshow' ? true  : false;
        window.scrollTo(0, 0);
    }

    // ── URL-STATE ──
    function parseState() {
        var p = new URLSearchParams(location.search);
        var album = p.get('album');
        var sub   = p.get('sub');
        if (album && !ALBEN[album]) album = null;
        if (album && sub) {
            var meta = ALBEN[album];
            if (!meta.subalbums || !meta.subalbums[sub]) sub = null;
        }
        return { album: album, sub: sub };
    }

    function renderFromState() {
        var s = parseState();
        if (!s.album) {
            setMode('grid');
            renderAlbumGrid();
            return;
        }
        if (albumHasSubalbums(s.album) && !s.sub) {
            setMode('grid');
            renderSubalbumGrid(s.album);
            return;
        }
        setMode('slideshow');
        renderSlideshow(photosFor(s.album, s.sub), s);
    }

    function navigateTo(album, sub) {
        var params = new URLSearchParams();
        if (album) params.set('album', album);
        if (sub)   params.set('sub', sub);
        var qs  = params.toString();
        var url = 'galerie.html' + (qs ? '?' + qs : '');
        history.pushState({}, '', url);
        renderFromState();
    }

    window.addEventListener('popstate', renderFromState);

    function updateCaption(animate) {
        if (animate) {
            caption.classList.remove('visible');
            caption.classList.add('out');
        }
        var delay = animate ? 300 : 450;
        setTimeout(function () {
            captionCat.textContent   = SLIDES[current].cat;
            captionTitle.textContent = SLIDES[current].title;
            caption.classList.remove('out');
            caption.classList.add('visible');
        }, delay);
    }

    function slides() { return gallery.querySelectorAll('.slide'); }

    function goTo(idx) {
        if (total === 0 || idx === current) return;
        slides()[current].classList.remove('active');
        current = (idx + total) % total;
        slides()[current].classList.add('active');
        counterCur.textContent = fmt(current + 1);
        progressFill.style.width = ((current + 1) / total * 100) + '%';
        updateCaption(true);
        resetAuto();
    }

    function next() { goTo(current + 1); }
    function prev() { goTo(current - 1); }

    function resetAuto() {
        clearInterval(autoTimer);
        autoTimer = setInterval(next, AUTO_MS);
    }

    // Navigation buttons
    document.getElementById('prevBtn').addEventListener('click', function (e) { e.stopPropagation(); prev(); });
    document.getElementById('nextBtn').addEventListener('click', function (e) { e.stopPropagation(); next(); });
    document.getElementById('zonePrev').addEventListener('click', prev);
    document.getElementById('zoneNext').addEventListener('click', next);

    // Click center of gallery → lightbox
    gallery.addEventListener('click', openLb);

    // Keyboard
    document.addEventListener('keydown', function (e) {
        if (slideshowView.hidden) return;
        if (lightbox.classList.contains('open')) {
            if (e.key === 'Escape') closeLb();
            if (e.key === 'ArrowLeft')  { closeLb(); prev(); }
            if (e.key === 'ArrowRight') { closeLb(); next(); }
            return;
        }
        if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
        if (e.key === 'ArrowLeft') prev();
        if (e.key === 'Enter') openLb();
    });

    // Touch swipe
    var tx = 0, ty = 0, swiping = false;
    gallery.addEventListener('touchstart', function (e) {
        tx = e.touches[0].clientX;
        ty = e.touches[0].clientY;
        swiping = true;
    }, { passive: true });
    gallery.addEventListener('touchend', function (e) {
        if (!swiping) return;
        swiping = false;
        var dx = e.changedTouches[0].clientX - tx;
        var dy = e.changedTouches[0].clientY - ty;
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 48) {
            dx < 0 ? next() : prev();
        } else if (Math.abs(dx) < 8 && Math.abs(dy) < 8) {
            openLb();
        }
    }, { passive: true });

    // Lightbox
    function openLb() {
        if (total === 0) return;
        var s = SLIDES[current];
        lbImg.src = s.src;
        lbImg.alt = s.title + ' — Café QUITO';
        lbBg.style.backgroundImage = 'url(' + s.src + ')';
        lbTitle.textContent = s.title;
        lbCat.textContent   = s.cat;
        lightbox.classList.add('open');
        clearInterval(autoTimer);
    }
    function closeLb() {
        lightbox.classList.remove('open');
        resetAuto();
    }
    document.getElementById('lbClose').addEventListener('click', closeLb);
    lightbox.addEventListener('click', function (e) {
        if (e.target === lightbox) closeLb();
    });

    // ── ADMIN AUTH ────────────────────────────────────────────
    // Das Passwort wird serverseitig geprüft (api/admin-auth.js) und lebt dort in der
    // Env-Var ADMIN_PASSWORD. Gleiche Session wie speisekarte.html (sessionStorage,
    // gleicher Schlüssel) — einmal anmelden reicht für beide Seiten im selben Tab.
    var ADMIN_KEY  = 'quito_admin_token';
    var getToken   = function () { return sessionStorage.getItem(ADMIN_KEY) || ''; };
    var tokenValid = function (t) { var exp = Number((t || '').split('.')[0]); return Number.isFinite(exp) && exp > Date.now(); };
    var isAdmin    = function () { return tokenValid(getToken()); };
    var setAdmin   = function (token) { sessionStorage.setItem(ADMIN_KEY, token); document.body.classList.add('admin-mode'); document.getElementById('adminBadge').classList.add('visible'); };
    var clearAdmin = function () { sessionStorage.removeItem(ADMIN_KEY); document.body.classList.remove('admin-mode'); document.getElementById('adminBadge').classList.remove('visible'); };

    var adminModal  = document.getElementById('adminModal');
    var adminPw     = document.getElementById('adminPw');
    var adminPwErr  = document.getElementById('adminPwErr');
    var adminOkBtn  = document.getElementById('adminOk');
    var showAdminErr = function (msg) { adminPwErr.textContent = msg; adminPwErr.style.display = 'block'; };
    var openAdminModal  = function () { adminPw.value = ''; adminPwErr.style.display = 'none'; adminModal.classList.add('open'); setTimeout(function () { adminPw.focus(); }, 50); };
    var closeAdminModal = function () { adminModal.classList.remove('open'); };

    document.getElementById('adminCancel').addEventListener('click', closeAdminModal);
    adminModal.addEventListener('click', function (e) { if (e.target === adminModal) closeAdminModal(); });

    async function tryLogin() {
        adminOkBtn.disabled = true;
        try {
            var res = await fetch('/api/admin-auth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: adminPw.value }),
            });
            var data = await res.json().catch(function () { return {}; });
            if (res.ok && data.token) {
                setAdmin(data.token);
                closeAdminModal();
            } else {
                showAdminErr(data.error || 'Falsches Passwort');
                adminPw.value = ''; adminPw.focus();
            }
        } catch (err) {
            showAdminErr('Verbindung fehlgeschlagen — bitte erneut versuchen');
        } finally {
            adminOkBtn.disabled = false;
        }
    }
    adminOkBtn.addEventListener('click', tryLogin);
    adminPw.addEventListener('keydown', function (e) { if (e.key === 'Enter') tryLogin(); });

    // Logo unter dem Album-Grid: 5× klicken → Admin-Modal
    var logoTaps = 0, logoTimer;
    document.getElementById('galleryAdminTrigger').addEventListener('click', function () {
        if (isAdmin()) return;
        logoTaps++;
        clearTimeout(logoTimer);
        logoTimer = setTimeout(function () { logoTaps = 0; }, 2000);
        if (logoTaps >= 5) { logoTaps = 0; openAdminModal(); }
    });
    if (isAdmin()) { document.body.classList.add('admin-mode'); document.getElementById('adminBadge').classList.add('visible'); }
    else { sessionStorage.removeItem(ADMIN_KEY); } // abgelaufenes Token aufräumen

    // ── SPEICHERN (persistiert Album-/Foto-Struktur für alle Besucher:innen) ──
    async function saveGalleryData() {
        var token = getToken();
        if (!tokenValid(token)) { clearAdmin(); alert('Admin-Sitzung abgelaufen. Bitte erneut anmelden.'); return false; }
        try {
            var res = await fetch('/api/gallery-data', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ albums: ALBEN, photos: ALL_PHOTOS, version: DATA_VERSION, token: token }),
            });
            var data = await res.json().catch(function () { return {}; });
            if (res.status === 409) {
                alert('Die Daten wurden inzwischen an anderer Stelle geändert. Die Ansicht wird aktualisiert.');
                if (data.current) {
                    ALBEN = data.current.albums;
                    ALL_PHOTOS = data.current.photos;
                    DATA_VERSION = data.current.version;
                    renderFromState();
                }
                return false;
            }
            if (!res.ok) { alert('Speichern fehlgeschlagen: ' + (data.error || '')); return false; }
            DATA_VERSION = data.version;
            return true;
        } catch (err) {
            alert('Speichern fehlgeschlagen: Verbindung unterbrochen.');
            return false;
        }
    }

    // ── ALBUM ANLEGEN / BEARBEITEN / LÖSCHEN ──
    var albumEditModal      = document.getElementById('albumEditModal');
    var albumEditTitleEl    = document.getElementById('albumEditTitle');
    var albumEditName       = document.getElementById('albumEditName');
    var albumEditOrder      = document.getElementById('albumEditOrder');
    var albumEditCoverField = document.getElementById('albumEditCoverField');
    var albumEditCoverGrid  = document.getElementById('albumEditCoverGrid');
    var albumEditCancel     = document.getElementById('albumEditCancel');
    var albumEditSave       = document.getElementById('albumEditSave');
    var albumEditDelete     = document.getElementById('albumEditDelete');

    var editingAlbumSlug = null;
    var selectedCoverId  = null;

    function renderCoverGrid(slug) {
        var photos = photosFor(slug);
        albumEditCoverGrid.innerHTML = '';
        photos.forEach(function (p) {
            var img = document.createElement('img');
            img.src = resolveSrc(p);
            img.alt = p.title;
            img.className = p.id === selectedCoverId ? 'selected' : '';
            img.addEventListener('click', function () {
                selectedCoverId = p.id;
                albumEditCoverGrid.querySelectorAll('img').forEach(function (i) { i.classList.remove('selected'); });
                img.classList.add('selected');
            });
            albumEditCoverGrid.appendChild(img);
        });
    }

    function openAlbumEditModal(slug) {
        editingAlbumSlug = slug;
        if (slug) {
            var meta = ALBEN[slug];
            albumEditTitleEl.textContent = 'Album bearbeiten';
            albumEditName.value  = meta.title;
            albumEditOrder.value = meta.order || 1;
            selectedCoverId = meta.cover || null;
            albumEditCoverField.style.display = '';
            renderCoverGrid(slug);
            albumEditDelete.style.display = slug === 'sonstige' ? 'none' : '';
        } else {
            var maxOrder = Object.keys(ALBEN).reduce(function (m, s) { return Math.max(m, ALBEN[s].order || 0); }, 0);
            albumEditTitleEl.textContent = 'Neues Album';
            albumEditName.value  = '';
            albumEditOrder.value = maxOrder + 1;
            selectedCoverId = null;
            albumEditCoverField.style.display = 'none';
            albumEditDelete.style.display = 'none';
        }
        albumEditModal.classList.add('open');
    }
    function closeAlbumEditModal() { albumEditModal.classList.remove('open'); }

    albumEditCancel.addEventListener('click', closeAlbumEditModal);
    albumEditModal.addEventListener('click', function (e) { if (e.target === albumEditModal) closeAlbumEditModal(); });

    albumEditSave.addEventListener('click', async function () {
        var title = albumEditName.value.trim();
        if (!title) { alert('Bitte einen Titel angeben.'); return; }
        var order = Number(albumEditOrder.value) || 99;
        var prevAlben = ALBEN;

        if (editingAlbumSlug) {
            ALBEN = Object.assign({}, ALBEN);
            ALBEN[editingAlbumSlug] = Object.assign({}, ALBEN[editingAlbumSlug], { title: title, order: order, cover: selectedCoverId });
        } else {
            var slug = slugify(title);
            if (!slug) { alert('Ungültiger Titel.'); return; }
            if (ALBEN[slug]) { alert('Es existiert bereits ein Album mit diesem Namen.'); return; }
            ALBEN = Object.assign({}, ALBEN);
            ALBEN[slug] = { title: title, order: order, cover: null, subalbums: null };
        }

        albumEditSave.disabled = true;
        var ok = await saveGalleryData();
        albumEditSave.disabled = false;
        if (!ok) { ALBEN = prevAlben; return; }
        closeAlbumEditModal();
        renderFromState();
    });

    albumEditDelete.addEventListener('click', async function () {
        if (!editingAlbumSlug || editingAlbumSlug === 'sonstige') return;
        var slug  = editingAlbumSlug;
        var count = albumPhotoCount(slug);
        var msg = count > 0
            ? ('Album löschen? ' + count + (count === 1 ? ' Foto wird' : ' Fotos werden') + ' nach „Weitere Eindrücke" verschoben.')
            : 'Album wirklich löschen?';
        if (!confirm(msg)) return;

        var prevAlben = ALBEN, prevPhotos = ALL_PHOTOS;
        ALBEN = Object.assign({}, ALBEN);
        delete ALBEN[slug];
        ALL_PHOTOS = ALL_PHOTOS.map(function (p) {
            return p.album === slug ? Object.assign({}, p, { album: 'sonstige' }) : p;
        });

        albumEditDelete.disabled = true;
        var ok = await saveGalleryData();
        albumEditDelete.disabled = false;
        if (!ok) { ALBEN = prevAlben; ALL_PHOTOS = prevPhotos; return; }
        closeAlbumEditModal();
        navigateTo(null, null);
    });

    // ── FOTO BEARBEITEN / LÖSCHEN ──
    var photoEditModal       = document.getElementById('photoEditModal');
    var photoEditTitleInput  = document.getElementById('photoEditTitle');
    var photoEditCatInput    = document.getElementById('photoEditCat');
    var photoEditAlbumSelect = document.getElementById('photoEditAlbum');
    var photoEditCancel      = document.getElementById('photoEditCancel');
    var photoEditSave        = document.getElementById('photoEditSave');
    var photoEditDelete      = document.getElementById('photoEditDelete');
    var editingPhotoId = null;

    function openPhotoEditModal(photo) {
        editingPhotoId = photo.id;
        photoEditTitleInput.value = photo.title || '';
        photoEditCatInput.value   = photo.cat || '';
        photoEditAlbumSelect.innerHTML = '';
        Object.keys(ALBEN)
            .sort(function (a, b) { return (ALBEN[a].order || 99) - (ALBEN[b].order || 99); })
            .forEach(function (slug) {

    photoEditCancel.addEventListener('click', closePhotoEditModal);
    photoEditModal.addEventListener('click', function (e) { if (e.target === photoEditModal) closePhotoEditModal(); });

    document.getElementById('lbEditBtn').addEventListener('click', function () {
        var s = SLIDES[current];
        if (s && s.photo) openPhotoEditModal(s.photo);
    });

    photoEditSave.addEventListener('click', async function () {
        var prevPhotos = ALL_PHOTOS;
        ALL_PHOTOS = ALL_PHOTOS.map(function (p) {
            if (p.id !== editingPhotoId) return p;
            return Object.assign({}, p, {
                title: photoEditTitleInput.value.trim() || p.title,
                cat: photoEditCatInput.value.trim(),
                album: photoEditAlbumSelect.value,
            });
        });
        photoEditSave.disabled = true;
        var ok = await saveGalleryData();
        photoEditSave.disabled = false;
        if (!ok) { ALL_PHOTOS = prevPhotos; return; }
        closePhotoEditModal();
        closeLb();

    // Löscht ein Foto (Metadaten + ggf. Blob-Datei) und rendert die Ansicht neu.
    // Gibt true zurück bei Erfolg, false wenn abgebrochen/fehlgeschlagen.
    async function deletePhoto(photoId, busyBtn) {
        var photo = ALL_PHOTOS.find(function (p) { return p.id === photoId; });
        if (!photo) return false;
        var prevPhotos = ALL_PHOTOS;
        ALL_PHOTOS = ALL_PHOTOS.filter(function (p) { return p.id !== photoId; });

        if (busyBtn) busyBtn.disabled = true;
        var ok = await saveGalleryData();
        if (busyBtn) busyBtn.disabled = false;
        if (!ok) { ALL_PHOTOS = prevPhotos; return false; }

        if (photo.source === 'blob') {
            var token = getToken();
            try {
                await fetch('/api/gallery-photos', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: photo.id, token: token }),
                });
            } catch (err) { /* Metadaten sind bereits entfernt; Datei-Löschung best effort */ }
        }
        renderFromState();
        return true;
    }

    photoEditDelete.addEventListener('click', async function () {
        if (!confirm('Foto wirklich löschen?')) return;
        var deleted = await deletePhoto(editingPhotoId, photoEditDelete);
        if (!deleted) return;
        closePhotoEditModal();
        closeLb();
    });

    var deletePhotoBtn = document.getElementById('deletePhotoBtn');
    deletePhotoBtn.addEventListener('click', async function () {
        var s = SLIDES[current];
        if (!s || !s.photo) return;
        if (!confirm('Foto „' + (s.photo.title || 'ohne Titel') + '" wirklich löschen?')) return;
        await deletePhoto(s.photo.id, deletePhotoBtn);
    });

    // ── FOTO HOCHLADEN (persistiert für alle Besucher:innen via Vercel Blob) ──
    function compressImage(file, maxDim, quality) {
        maxDim = maxDim || 1600; quality = quality || 0.85;
        return new Promise(function (resolve) {
            var img = new Image();
            var url = URL.createObjectURL(file);
            img.onload = function () {
                var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
                var canvas = document.createElement('canvas');
                canvas.width  = Math.round(img.width  * scale);
                canvas.height = Math.round(img.height * scale);
                canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                URL.revokeObjectURL(url);
                resolve({ dataUrl: canvas.toDataURL('image/jpeg', quality), orient: img.width >= img.height ? 'landscape' : 'portrait' });
            };
            img.src = url;
        });
    }

    var addPhotoBtn = document.getElementById('addPhotoBtn');
    var galleryImgInput = document.createElement('input');
    galleryImgInput.type = 'file'; galleryImgInput.accept = 'image/*'; galleryImgInput.multiple = true; galleryImgInput.style.display = 'none';
    document.body.appendChild(galleryImgInput);

    addPhotoBtn.addEventListener('click', function () { galleryImgInput.click(); });

    galleryImgInput.addEventListener('change', async function () {
        var files = Array.prototype.slice.call(galleryImgInput.files);
        galleryImgInput.value = '';
        if (!files.length) return;

        var token = getToken();
        if (!tokenValid(token)) { clearAdmin(); alert('Admin-Sitzung abgelaufen. Bitte erneut anmelden.'); return; }

        var s = parseState();
        var targetAlbum = s.album && ALBEN[s.album] ? s.album : 'sonstige';

        addPhotoBtn.disabled = true;
        var btnLabel = addPhotoBtn.textContent;
        var prevPhotos = ALL_PHOTOS;
        var failed = [];
        try {
            for (var i = 0; i < files.length; i++) {
                var file = files[i];
                addPhotoBtn.textContent = '+ Foto (' + (i + 1) + '/' + files.length + ')';
                try {
                    var compressed = await compressImage(file);
                    var res = await fetch('/api/gallery-photos', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ image: compressed.dataUrl, token: token }),
                    });
                    var data = await res.json().catch(function () { return {}; });
                    if (!res.ok) throw new Error(data.error || 'Upload fehlgeschlagen');

                    var newPhoto = {
                        id: data.id,
                        src: data.url,
                        source: 'blob',
                        title: file.name.replace(/\.[^.]+$/, ''),
                        cat: ALBEN[targetAlbum] ? ALBEN[targetAlbum].title : '',
                        orient: compressed.orient,
                        album: targetAlbum,
                        subalbum: null,
                    };
                    ALL_PHOTOS = ALL_PHOTOS.concat([newPhoto]);
                } catch (err) {
                    failed.push(file.name + ': ' + err.message);
                }
            }

            if (ALL_PHOTOS !== prevPhotos) {
                var ok = await saveGalleryData();
                if (!ok) { ALL_PHOTOS = prevPhotos; return; }
                renderFromState();
            }
            if (failed.length) alert('Manche Fotos konnten nicht hochgeladen werden:\n' + failed.join('\n'));
        } finally {
            addPhotoBtn.disabled = false;
            addPhotoBtn.textContent = btnLabel;
        }
    });

    loadGalleryData().then(renderFromState);
})();
</script>

</body>
</html>
