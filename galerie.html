    <title>Galerie — QUITO Café</title>
    <meta name="description" content="Bilder aus dem Café QUITO in Frankenthal — Interieur, Kaffee, Frühstück, Team und mehr.">
    <meta name="theme-color" content="#0b0906"><style>

    <style>
        :root {
            --black:      #0b0906;
            --terracotta: #C4793A;
            --warm-white: #F4EFE6;
            --muted:      rgba(244, 239, 230, 0.45);
            --font-d: 'Cormorant Garamond', serif;
            --font-b: 'Source Sans 3', sans-serif;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
            --pad: clamp(1.5rem, 4vw, 3rem);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: var(--font-b);
            background: var(--black);
            color: var(--warm-white);
            -webkit-font-smoothing: antialiased;
        }
        a { text-decoration: none; color: inherit; }

        /* ── SLIDES ── */
        .gallery {
            position: fixed;
            inset: 0;
            z-index: 1;
            cursor: zoom-in;
        }
        .slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 1s ease;
            will-change: opacity;
        }
        .slide.active { opacity: 1; }
        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.04);
            transition: transform 7s var(--ease);
        }
        .slide.active img { transform: scale(1); }

        /* ── LIGHT GRADIENTS (legibility only — no schlieren) ── */
        .grad-top {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 180px;
            background: linear-gradient(to bottom, rgba(11,9,6,.72) 0%, transparent 100%);
            z-index: 10;
            pointer-events: none;
        }
        .grad-bottom {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 260px;
            background: linear-gradient(to top, rgba(11,9,6,.82) 0%, rgba(11,9,6,.28) 60%, transparent 100%);
            z-index: 10;
            pointer-events: none;
        }

        /* ── HOVER ZONES (prev / next) ── */
        .zone {
            position: fixed;
            top: 0; bottom: 0;
            z-index: 20;
            width: 22%;
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .zone-prev { left: 0; justify-content: flex-start; padding-left: clamp(1rem, 2.5vw, 2rem); }
        .zone-next { right: 0; justify-content: flex-end;  padding-right: clamp(1rem, 2.5vw, 2rem); }
        .zone-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border: 1px solid rgba(244, 239, 230, 0.22);
            border-radius: 50%;
            opacity: 0;
            transform: scale(.88);
            transition: opacity .35s ease, transform .35s var(--ease), border-color .3s;
        }
        .zone-icon svg { width: 14px; height: 14px; stroke: var(--warm-white); fill: none; stroke-width: 1.5; }
        .zone:hover .zone-icon {
            opacity: 1;
            transform: scale(1);
        }
        .zone:hover .zone-icon { border-color: rgba(244, 239, 230, 0.45); }

        /* ── TOP BAR ── */
        .bar-top {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 30;
            padding: clamp(1.2rem, 2.8vw, 2rem) var(--pad);
            padding-top: calc(clamp(1.2rem, 2.8vw, 2rem) + env(safe-area-inset-top));
            display: flex;
            align-items: center;
            justify-content: space-between;
            opacity: 0;
            animation: fadeIn .9s var(--ease) .2s forwards;
        }

        .back-link {
            font-family: var(--font-b);
            font-size: .68rem;
            font-weight: 400;
            letter-spacing: .16em;
            text-transform: uppercase;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: .65rem;
            transition: color .3s;
        }
        .back-link .line {
            display: block;
            width: 22px;
            height: 1px;
            background: currentColor;
            transition: width .35s var(--ease);
        }
        .back-link:hover { color: var(--warm-white); }
        .back-link:hover .line { width: 34px; }

        .bar-label {
            font-family: var(--font-b);
            font-size: .6rem;
            font-weight: 500;
            letter-spacing: .24em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .counter {
            display: flex;
            align-items: baseline;
            gap: .25rem;
        }
        .counter-cur {
            font-family: var(--font-d);
            font-size: 1.05rem;
            font-weight: 300;
            color: var(--warm-white);
            letter-spacing: .03em;
            min-width: 1.6ch;
            transition: opacity .25s ease;
        }
        .counter-sep {
            font-family: var(--font-b);
            font-size: .55rem;
            color: var(--muted);
            letter-spacing: .08em;
            margin: 0 .05rem;
        }
        .counter-tot {
            font-family: var(--font-d);
            font-size: .78rem;
            font-weight: 300;
            color: var(--muted);
            letter-spacing: .03em;
        }

        /* ── BOTTOM CAPTION ── */
        .caption {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 30;
            padding: var(--pad);
            padding-bottom: calc(var(--pad) + env(safe-area-inset-bottom));
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
        }

        .caption-text { flex: 1; }
        .caption-cat {
            font-family: var(--font-b);
            font-size: .6rem;
            font-weight: 500;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: var(--terracotta);
            margin-bottom: .45rem;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity .45s ease .1s, transform .45s var(--ease) .1s;
        }
        .caption-title {
            font-family: var(--font-d);
            font-size: clamp(1.9rem, 4.5vw, 3.4rem);
            font-weight: 300;
            font-style: italic;
            color: var(--warm-white);
            letter-spacing: .01em;
            line-height: 1.1;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity .55s ease .2s, transform .55s var(--ease) .2s;
        }
        .caption.visible .caption-cat,
        .caption.visible .caption-title {
            opacity: 1;
            transform: translateY(0);
        }
        .caption.out .caption-cat,
        .caption.out .caption-title {
            opacity: 0;
            transform: translateY(-6px);
            transition: opacity .28s ease, transform .28s var(--ease);
        }

        /* Bottom nav */
        .cap-nav {
            display: flex;
            align-items: center;
            gap: .5rem;
            padding-bottom: .2rem;
        }
        .nav-btn {
            background: none;
            border: 1px solid rgba(244, 239, 230, 0.18);
            color: var(--muted);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: border-color .3s, color .3s, background .3s;
        }
        .nav-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.5; }
        .nav-btn:hover {
            border-color: rgba(244, 239, 230, 0.5);
            color: var(--warm-white);
            background: rgba(244, 239, 230, .04);
        }
        .nav-btn:focus-visible { outline: 2px solid var(--terracotta); outline-offset: 3px; }

        /* ── PROGRESS LINE ── */
        .progress {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 1px;
            background: rgba(244, 239, 230, .08);
            z-index: 40;
            pointer-events: none;
        }
        .progress-fill {
            height: 100%;
            background: var(--terracotta);
            transition: width .65s var(--ease);
            width: 0%;
        }

        /* ── LIGHTBOX ── */
        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(11, 9, 6, .96);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(2rem, 5vw, 4rem);
            opacity: 0;
            pointer-events: none;
            transition: opacity .5s ease;
        }
        .lightbox.open {
            opacity: 1;
            pointer-events: auto;
        }
        .lb-inner {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            max-width: min(88vw, 1100px);
        }
        .lb-inner img {
            max-height: 78vh;
            max-width: 100%;
            object-fit: contain;
            display: block;
        }
        .lb-meta {
            display: flex;
            align-items: baseline;
            gap: 1.2rem;
            margin-top: 1.1rem;
        }
        .lb-title {
            font-family: var(--font-d);
            font-size: clamp(1rem, 2vw, 1.4rem);
            font-weight: 300;
            font-style: italic;
            color: var(--warm-white);
        }
        .lb-cat {
            font-family: var(--font-b);
            font-size: .58rem;
            font-weight: 500;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: var(--terracotta);
        }
        .lb-close {
            position: absolute;
            top: -2.4rem;
            right: 0;
            background: none;
            border: none;
            color: var(--muted);
            font-family: var(--font-b);
            font-size: .6rem;
            font-weight: 500;
            letter-spacing: .16em;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: .5rem;
            padding: 0;
            transition: color .3s;
        }
        .lb-close::after {
            content: '';
            display: block;
            width: 14px;
            height: 1px;
            background: currentColor;
        }
        .lb-close:hover { color: var(--warm-white); }
        .lb-close:focus-visible { outline: 2px solid var(--terracotta); outline-offset: 3px; }

        /* ── INITIAL FADE ── */
        @keyframes fadeIn { to { opacity: 1; } }

        /* ── MOBILE ── */
        @keyframes hint-arrow {
            0%   { opacity: 0; transform: scale(.88); }
            25%  { opacity: 1; transform: scale(1); }
            75%  { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(.88); }
        }
        @media (max-width: 768px) {
            .bar-label { display: none; }
            .zone { width: 28%; }
            .zone-next .zone-icon {
                animation: hint-arrow 2s var(--ease) 0.8s 1;
            }
        }
        @media (max-width: 480px) {
            .caption-title { font-size: 1.75rem; }
            .cap-nav { display: none; }
        }

        /* ── REDUCED MOTION ── */
        @media (prefers-reduced-motion: reduce) {
            .slide { transition: opacity .3s ease; }
            .slide img { transition: none; transform: scale(1); }
            .caption-cat, .caption-title { transition: opacity .2s ease; }
            .bar-top { animation: none; opacity: 1; }
        }

        /* ── ALBUM GRID VIEW ── */
        html.mode-grid, html.mode-grid body { height: auto; overflow-y: auto; overflow-x: hidden; }

        .album-view { position: relative; z-index: 1; min-height: 100vh; padding: calc(var(--pad) + 3rem) var(--pad) var(--pad); padding-top: calc(var(--pad) + 3rem + env(safe-area-inset-top)); max-width: 1400px; margin: 0 auto; }
        .album-view[hidden] { display: none; }

        .album-view-head { margin-bottom: clamp(2rem, 5vw, 3.5rem); opacity: 0; animation: fadeIn .9s var(--ease) .1s forwards; }
        .album-view-head .back-link { margin-bottom: 1.6rem; }
        .album-view-title { font-family: var(--font-d); font-style: italic; font-weight: 300; font-size: clamp(2.1rem, 6vw, 3.6rem); color: var(--warm-white); letter-spacing: .01em; }
        .album-view-sub { font-family: var(--font-b); font-size: .92rem; color: var(--muted); margin-top: .65rem; }

        .album-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: clamp(1.5rem, 3vw, 2.5rem); }

        .album-tile { display: block; cursor: pointer; opacity: 0; transform: translateY(14px); animation: albumTileIn .7s var(--ease) forwards; }
        @keyframes albumTileIn { to { opacity: 1; transform: none; } }
        .album-tile-media { position: relative; aspect-ratio: 4/5; border-radius: 6px; overflow: hidden; background: #151109; }
        .album-tile-media img { width: 100%; height: 100%; object-fit: cover; display: block; transform: scale(1.02); transition: transform .7s var(--ease); }
        .album-tile:hover .album-tile-media img { transform: scale(1.08); }
        .album-tile-media::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(11,9,6,.55) 0%, transparent 45%); pointer-events: none; }

        .album-tile-count { position: absolute; bottom: .9rem; right: .9rem; font-family: var(--font-b); font-size: .58rem; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--warm-white); background: rgba(11,9,6,.55); border: 1px solid rgba(244,239,230,.25); padding: .4em .9em; border-radius: 999px; backdrop-filter: blur(3px); }

        .album-tile-text { padding-top: 1.1rem; }
        .album-tile-cat { display: block; font-family: var(--font-b); font-size: .6rem; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--terracotta); margin-bottom: .4rem; }
        .album-tile-title { font-family: var(--font-d); font-style: italic; font-weight: 300; font-size: clamp(1.35rem, 2.4vw, 1.9rem); color: var(--warm-white); letter-spacing: .01em; }

        @media (max-width: 768px) {
            .album-grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
            .album-tile-title { font-size: 1.05rem; }
        }
        @media (max-width: 480px) {
            .album-grid { grid-template-columns: 1fr; }
        }
        @media (prefers-reduced-motion: reduce) {
            .album-tile { opacity: 1; transform: none; animation: none; }
            .album-view-head { opacity: 1; animation: none; }
        }

        /* === FOOTER === */
        footer { background: var(--black); color: #fff; padding: clamp(3rem,6vw,5rem) 0 calc(clamp(2rem,4vw,3rem) + env(safe-area-inset-bottom)); }
        .foot-inner { max-width: var(--max); margin: 0 auto; padding: 0 var(--pad); display: flex; flex-direction: column; align-items: center; gap: 0; text-align: center; }
        .foot-logo { margin-bottom: 2rem; }
        .foot-logo img  { height: 30px; filter: invert(1); margin: 0 auto; }
        .foot-logo-text { font-family: var(--font-b); font-weight: 700; font-size: 1.6rem; letter-spacing: .12em; text-transform: uppercase; color: #fff; display: none; }
        .foot-info { display: flex; flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0; margin-bottom: 1.75rem; }
        .foot-info p { font-size: .95rem; color: rgba(255,255,255,.55); line-height: 1.7; }
        .foot-info p + p::before { content: '·'; margin: 0 1.25rem; color: rgba(255,255,255,.25); }
        .foot-info a { color: rgba(255,255,255,.55); transition: color .2s; }
        .foot-info a:hover { color: #fff; }
        .foot-social { display: flex; align-items: center; justify-content: center; gap: .6rem; margin-bottom: 2.5rem; color: rgba(255,255,255,.55); font-size: .92rem; transition: color .2s; }
        .foot-social:hover { color: #fff; }
        .foot-social svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
        .foot-divider { width: 48px; height: 1px; background: rgba(255,255,255,.15); margin: 0 auto 2rem; }
        .foot-bottom { display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 2rem; flex-wrap: wrap; }
        .foot-copy { font-size: .78rem; color: rgba(255,255,255,.3); }
        .foot-links { display: flex; gap: 2rem; list-style: none; }
        .foot-links a { font-size: .78rem; color: rgba(255,255,255,.4); transition: color .2s; }
        .foot-links a:hover { color: #fff; }
        .foot-credit { font-size: .78rem; color: rgba(255,255,255,.2); }
        .foot-credit-sep { color: rgba(255,255,255,.15); margin: 0 .4em; }
        .foot-credit-block { display: none; }
        @media (max-width: 480px) {
            .foot-info { flex-direction: column; gap: .35rem; }
            .foot-info p + p::before { content: none; }
            .foot-bottom { flex-direction: column; gap: .6rem; }
            .foot-credit-inline, .foot-credit-sep { display: none; }
            .foot-credit-block { display: block; text-align: center; margin-top: calc(-0.6rem + .15rem); }
        }
    </style>
</head>
<body>

<!-- SLIDESHOW VIEW -->
<div id="slideshowView">

    <!-- SLIDES -->
    <div class="gallery" id="gallery" aria-label="Galerie Slideshow"></div>

    <!-- GRADIENTS -->
    <div class="grad-top"></div>
    <div class="grad-bottom"></div>

    <!-- HOVER ZONES -->
    <div class="zone zone-prev" id="zonePrev" role="button" aria-label="Vorheriges Bild">
        <div class="zone-icon">
            <svg viewBox="0 0 14 14"><polyline points="9,2 4,7 9,12"/></svg>
        </div>
    </div>
    <div class="zone zone-next" id="zoneNext" role="button" aria-label="Nächstes Bild">
        <div class="zone-icon">
            <svg viewBox="0 0 14 14"><polyline points="5,2 10,7 5,12"/></svg>
        </div>
    </div>

    <!-- TOP BAR -->
    <div class="bar-top">
        <a href="galerie.html" class="back-link" id="slideshowBack">
            <span class="line"></span>Zurück
        </a>
        <span class="bar-label">Galerie</span>
        <div class="counter">
            <span class="counter-cur" id="counterCur">01</span>
            <span class="counter-sep">/</span>
            <span class="counter-tot" id="counterTot">07</span>
        </div>
    </div>

    <!-- CAPTION -->
    <div class="caption" id="caption">
        <div class="caption-text">
            <div class="caption-cat"  id="captionCat"></div>
            <div class="caption-title" id="captionTitle"></div>
        </div>
        <nav class="cap-nav" aria-label="Bildnavigation">
            <button class="nav-btn" id="prevBtn" aria-label="Vorheriges Bild">
                <svg viewBox="0 0 14 14"><polyline points="9,2 4,7 9,12"/></svg>
            </button>
            <button class="nav-btn" id="nextBtn" aria-label="Nächstes Bild">
                <svg viewBox="0 0 14 14"><polyline points="5,2 10,7 5,12"/></svg>
            </button>
        </nav>
    </div>

    <!-- PROGRESS -->
    <div class="progress"><div class="progress-fill" id="progressFill"></div></div>

    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Bild vergrößert">
        <div class="lb-inner">
            <button class="lb-close" id="lbClose">Schließen</button>
            <img id="lbImg" src="" alt="">
            <div class="lb-meta">
                <span class="lb-title" id="lbTitle"></span>
                <span class="lb-cat"   id="lbCat"></span>
            </div>
        </div>
    </div>

</div>

<!-- ALBUM OVERVIEW VIEW -->
<main class="album-view" id="albumView" hidden>
    <div class="album-view-head">
        <a href="index.html" class="back-link" id="albumViewBack">
            <span class="line"></span>Zurück
        </a>
        <h1 class="album-view-title" id="albumViewTitle">Galerie</h1>
        <p class="album-view-sub" id="albumViewSub"></p>
    </div>
    <div class="album-grid" id="albumGrid"></div>
</main>

<script id="galerie-data">
window.GALERIE_DATA = [
  {"src": "hero.WEBP", "title": "Das Café", "cat": "Interieur", "orient": "landscape", "album": "interieur", "subalbum": null},
  {"src": "cafe-innen.JPG", "title": "Innenraum", "cat": "Interieur", "orient": "both", "album": "interieur", "subalbum": null},
  {"src": "kaffee.jpeg", "title": "Specialty Coffee", "cat": "Kaffee", "orient": "portrait", "album": "kaffee-kueche", "subalbum": null},
  {"src": "fruehstueck.jpeg", "title": "Frühstück", "cat": "Frühstück", "orient": "portrait", "album": "kaffee-kueche", "subalbum": null},
  {"src": "essen.JPG.jpg", "title": "Mittagessen", "cat": "Essen", "orient": "landscape", "album": "kaffee-kueche", "subalbum": null},
  {"src": "team.JPG", "title": "Unser Team", "cat": "Team", "orient": "landscape", "album": "team-geschichte", "subalbum": null},

];
</script>

<!-- ALBEN-DATEN (wird von scripts/update-galerie.sh aktualisiert) -->
<script id="alben-data">
window.ALBEN_DATA = {
  "interieur": {
    "title": "Café & Interieur",
    "order": 1,
    "cover": "hero.WEBP"
  },
  "kaffee-kueche": {
    "title": "Kaffee & Küche",
    "order": 2,
    "cover": "kaffee.jpeg"
  },
  "team-geschichte": {
    "title": "Team & Geschichte",
    "order": 3,
    "cover": "team.JPG"
  },
  "sonstige": {
    "title": "Weitere Eindrücke",
    "order": 99,
    "cover": null
  }
};
</script>

<script>
(function () {
    var isMobile    = window.innerWidth <= 768;
    var AUTO_MS     = 4000;
    var current     = 0;
    var total       = 0;
    var autoTimer   = null;
    var SLIDES      = [];

    var htmlEl        = document.documentElement;
    var slideshowView = document.getElementById('slideshowView');
    var albumView      = document.getElementById('albumView');
    var albumViewBack  = document.getElementById('albumViewBack');
    var albumViewTitle = document.getElementById('albumViewTitle');
    var albumViewSub   = document.getElementById('albumViewSub');
    var albumGrid       = document.getElementById('albumGrid');
    var slideshowBack   = document.getElementById('slideshowBack');

    var gallery      = document.getElementById('gallery');
    var caption      = document.getElementById('caption');
    var captionCat   = document.getElementById('captionCat');
    var captionTitle = document.getElementById('captionTitle');
    var counterCur   = document.getElementById('counterCur');
    var counterTot   = document.getElementById('counterTot');
    var progressFill = document.getElementById('progressFill');
    var lightbox     = document.getElementById('lightbox');
    var lbImg        = document.getElementById('lbImg');
    var lbTitle      = document.getElementById('lbTitle');
    var lbCat        = document.getElementById('lbCat');

    function fmt(n) { return n < 10 ? '0' + n : '' + n; }

    // Bilddaten aus Inline-Variablen laden (via scripts/update-galerie.sh aktuell gehalten)
    var ALL_PHOTOS = window.GALERIE_DATA || [];
    var ALBEN      = window.ALBEN_DATA || {};

    function photosFor(album, sub) {
        return ALL_PHOTOS.filter(function (p) {
            var a = p.album || 'sonstige';
            if (a !== album) return false;
            if (sub) return p.subalbum === sub;
            return true;
        });
    }

    function albumPhotoCount(album) {
        return ALL_PHOTOS.filter(function (p) { return (p.album || 'sonstige') === album; }).length;
    }

    function albumHasSubalbums(slug) {
        var meta = ALBEN[slug];
        return !!(meta && meta.subalbums && Object.keys(meta.subalbums).length);
    }

    function coverSrc(photos, explicitCover) {
        if (explicitCover) return '../bilder/' + explicitCover;
        if (photos.length) return '../bilder/' + photos[0].src;
        return '../bilder/hero.WEBP';
    }

    // ── ALBUM-KACHEL BAUEN ──
    function buildTile(opts) {
        var a = document.createElement('a');
        a.className = 'album-tile';
        a.href = opts.href;
        a.style.animationDelay = (opts.delay * 0.06) + 's';
        a.addEventListener('click', function (e) {
            e.preventDefault();
            opts.onClick();
        });

        var media = document.createElement('div');
        media.className = 'album-tile-media';
        var img = document.createElement('img');
        img.src      = opts.cover;
        img.alt      = opts.title;
        img.loading  = 'lazy';
        img.decoding = 'async';
        media.appendChild(img);

        var countBadge = document.createElement('span');
        countBadge.className = 'album-tile-count';
        countBadge.textContent = opts.count + (opts.count === 1 ? ' Foto' : ' Fotos');
        media.appendChild(countBadge);

        var text = document.createElement('div');
        text.className = 'album-tile-text';
        var cat = document.createElement('span');
        cat.className = 'album-tile-cat';
        cat.textContent = opts.cat;
        var title = document.createElement('h2');
        title.className = 'album-tile-title';
        title.textContent = opts.title;
        text.appendChild(cat);
        text.appendChild(title);

        a.appendChild(media);
        a.appendChild(text);
        return a;
    }

    // ── TOP-LEVEL ALBUM-GRID ──
    function renderAlbumGrid() {
        albumViewBack.href = 'index.html';
        albumViewBack.onclick = null;
        albumViewTitle.textContent = 'Galerie';
        albumViewSub.textContent = 'Ein Blick in unser Café — in Bildern.';

        var slugs = Object.keys(ALBEN).filter(function (slug) {
            return albumPhotoCount(slug) > 0 || albumHasSubalbums(slug);
        });
        slugs.sort(function (a, b) { return (ALBEN[a].order || 99) - (ALBEN[b].order || 99); });

        albumGrid.innerHTML = '';
        slugs.forEach(function (slug, i) {
            var meta   = ALBEN[slug];
            var photos = photosFor(slug);
            albumGrid.appendChild(buildTile({
                href: 'galerie.html?album=' + encodeURIComponent(slug),
                cover: coverSrc(photos, meta.cover),
                title: meta.title,
                cat: 'Galerie',
                count: albumPhotoCount(slug),
                delay: i,
                onClick: function () { navigateTo(slug, null); }
            }));
        });
    }

    // ── UNTERALBEN-GRID ──
    function renderSubalbumGrid(albumSlug) {
        var meta = ALBEN[albumSlug];
        albumViewBack.href = 'galerie.html';
        albumViewBack.onclick = function (e) { e.preventDefault(); navigateTo(null, null); };
        albumViewTitle.textContent = meta.title;
        albumViewSub.textContent = '';

        var subSlugs = Object.keys(meta.subalbums || {});
        subSlugs.sort(function (a, b) { return (meta.subalbums[a].order || 99) - (meta.subalbums[b].order || 99); });

        albumGrid.innerHTML = '';
        subSlugs.forEach(function (subSlug, i) {
            var subMeta = meta.subalbums[subSlug];
            var photos  = photosFor(albumSlug, subSlug);
            albumGrid.appendChild(buildTile({
                href: 'galerie.html?album=' + encodeURIComponent(albumSlug) + '&sub=' + encodeURIComponent(subSlug),
                cover: coverSrc(photos, subMeta.cover),
                title: subMeta.title,
                cat: meta.title,
                count: photos.length,
                delay: i,
                onClick: function () { navigateTo(albumSlug, subSlug); }
            }));
        });
    }

    // ── SLIDESHOW (wiedereintrittsfähig) ──
    function renderSlideshow(photos, state) {
        var filtered = photos.filter(function (s) {
            var o = s.orient || 'both';
            return o === 'both' || (isMobile ? o === 'portrait' : o === 'landscape');
        });
        if (filtered.length === 0) filtered = photos;

        SLIDES = filtered.map(function (s) {
            return { src: '../bilder/' + s.src, title: s.title, cat: s.cat };
        });

        clearInterval(autoTimer);
        gallery.innerHTML = '';
        current = 0;
        total = SLIDES.length;
        counterTot.textContent = fmt(total);

        SLIDES.forEach(function (s, i) {
            var div = document.createElement('div');
            div.className = 'slide' + (i === 0 ? ' active' : '');
            var img = document.createElement('img');
            img.src      = s.src;
            img.alt      = s.title + ' — Café QUITO';
            img.loading  = i < 2 ? 'eager' : 'lazy';
            img.decoding = 'async';
            div.appendChild(img);
            gallery.appendChild(div);
        });

        progressFill.style.width = total ? (1 / total * 100) + '%' : '0%';
        if (total > 0) {
            updateCaption(false);
            autoTimer = setInterval(next, AUTO_MS);
        } else {
            captionCat.textContent = '';
            captionTitle.textContent = '';
        }

        var hasSubs = albumHasSubalbums(state.album);
        slideshowBack.onclick = function (e) {
            e.preventDefault();
            if (hasSubs) navigateTo(state.album, null);
            else navigateTo(null, null);
        };
    }

    // ── MODUS-STEUERUNG (Grid vs. Slideshow) ──
    function setMode(mode) {
        htmlEl.classList.toggle('mode-grid', mode !== 'slideshow');
        slideshowView.hidden = mode === 'slideshow' ? false : true;
        albumView.hidden     = mode === 'slideshow' ? true  : false;
        window.scrollTo(0, 0);
    }

    // ── URL-STATE ──
    function parseState() {
        var p = new URLSearchParams(location.search);
        var album = p.get('album');
        var sub   = p.get('sub');
        if (album && !ALBEN[album]) album = null;
        if (album && sub) {
            var meta = ALBEN[album];
            if (!meta.subalbums || !meta.subalbums[sub]) sub = null;
        }
        return { album: album, sub: sub };
    }

    function renderFromState() {
        var s = parseState();
        if (!s.album) {
            setMode('grid');
            renderAlbumGrid();
            return;
        }
        if (albumHasSubalbums(s.album) && !s.sub) {
            setMode('grid');
            renderSubalbumGrid(s.album);
            return;
        }
        setMode('slideshow');
        renderSlideshow(photosFor(s.album, s.sub), s);
    }

    function navigateTo(album, sub) {
        var params = new URLSearchParams();
        if (album) params.set('album', album);
        if (sub)   params.set('sub', sub);
        var qs  = params.toString();
        var url = 'galerie.html' + (qs ? '?' + qs : '');
        history.pushState({}, '', url);
        renderFromState();
    }

    window.addEventListener('popstate', renderFromState);

    function updateCaption(animate) {
        if (animate) {
            caption.classList.remove('visible');
            caption.classList.add('out');
        }
        var delay = animate ? 300 : 450;
        setTimeout(function () {
            captionCat.textContent   = SLIDES[current].cat;
            captionTitle.textContent = SLIDES[current].title;
            caption.classList.remove('out');
            caption.classList.add('visible');
        }, delay);
    }

    function slides() { return gallery.querySelectorAll('.slide'); }

    function goTo(idx) {
        if (total === 0 || idx === current) return;
        slides()[current].classList.remove('active');
        current = (idx + total) % total;
        slides()[current].classList.add('active');
        counterCur.textContent = fmt(current + 1);
        progressFill.style.width = ((current + 1) / total * 100) + '%';
        updateCaption(true);
        resetAuto();
    }

    function next() { goTo(current + 1); }
    function prev() { goTo(current - 1); }

    function resetAuto() {
        clearInterval(autoTimer);
        autoTimer = setInterval(next, AUTO_MS);
    }

    // Navigation buttons
    document.getElementById('prevBtn').addEventListener('click', function (e) { e.stopPropagation(); prev(); });
    document.getElementById('nextBtn').addEventListener('click', function (e) { e.stopPropagation(); next(); });
    document.getElementById('zonePrev').addEventListener('click', prev);
    document.getElementById('zoneNext').addEventListener('click', next);

    // Click center of gallery → lightbox
    gallery.addEventListener('click', openLb);

    // Keyboard
    document.addEventListener('keydown', function (e) {
        if (slideshowView.hidden) return;
        if (lightbox.classList.contains('open')) {
            if (e.key === 'Escape') closeLb();
            if (e.key === 'ArrowLeft')  { closeLb(); prev(); }
            if (e.key === 'ArrowRight') { closeLb(); next(); }
            return;
        }
        if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
        if (e.key === 'ArrowLeft') prev();
        if (e.key === 'Enter') openLb();
    });

    // Touch swipe
    var tx = 0, ty = 0, swiping = false;
    gallery.addEventListener('touchstart', function (e) {
        tx = e.touches[0].clientX;
        ty = e.touches[0].clientY;
        swiping = true;
    }, { passive: true });
    gallery.addEventListener('touchend', function (e) {
        if (!swiping) return;
        swiping = false;
        var dx = e.changedTouches[0].clientX - tx;
        var dy = e.changedTouches[0].clientY - ty;
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 48) {
            dx < 0 ? next() : prev();
        } else if (Math.abs(dx) < 8 && Math.abs(dy) < 8) {
            openLb();
        }
    }, { passive: true });

    // Lightbox
    function openLb() {
        if (total === 0) return;
        var s = SLIDES[current];
        lbImg.src = s.src;
        lbImg.alt = s.title + ' — Café QUITO';
        lbTitle.textContent = s.title;
        lbCat.textContent   = s.cat;
        lightbox.classList.add('open');
        clearInterval(autoTimer);
    }
    function closeLb() {
        lightbox.classList.remove('open');
        resetAuto();
    }
    document.getElementById('lbClose').addEventListener('click', closeLb);
    lightbox.addEventListener('click', function (e) {
        if (e.target === lightbox) closeLb();
    });

    renderFromState();
})();
</script>
